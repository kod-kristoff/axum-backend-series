[package]
name = "axum-backend-series"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib/lib.rs"

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["http2", "macros"] }
bcrypt = "0.18.0"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
lettre = { version = "0.11.19", features = ["tokio1-rustls-tls", "builder", "hostname", "smtp-transport", "pool", "ring", "rustls-platform-verifier", "mime03"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }
